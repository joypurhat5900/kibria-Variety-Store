<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>অ্যাডমিন – নেটলিংক</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"><\/script>')</script>
<style>
:root{--bg:#f4f8fb;--card:#fff;--ink:#10243a;--mute:#5b6b7c;--pri:#0a5cff;--pri2:#0b3fb3;--acc:#ff7a1a;--line:#dde6ee;--ok:#12a150;--bad:#d93025;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1522;--card:#13243a;--ink:#eaf1f9;--mute:#9db0c4;--line:#243a55}}
:root[data-theme="dark"]{--bg:#0b1522;--card:#13243a;--ink:#eaf1f9;--mute:#9db0c4;--line:#243a55}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hind Siliguri',system-ui,sans-serif;line-height:1.6}
.w{max-width:980px;margin:auto;padding:0 16px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--line);z-index:5}
header .w{display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{font-weight:700;font-size:20px;color:var(--pri)}.logo b{color:var(--acc)}
.hr{display:flex;gap:8px;align-items:center;font-size:14px}
button{font-family:inherit;cursor:pointer}
.lk{background:none;border:0;color:var(--pri);font-size:14px;padding:4px}
.hero{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;padding:28px 0 70px}
.hero h1{font-size:clamp(24px,6vw,36px);line-height:1.25;margin:0 0 4px}
.bal{margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:rgba(255,255,255,.15);border-radius:14px;padding:12px 16px;max-width:420px}
.bal small{display:block;opacity:.85}.bal b{font-size:28px}
.bal button{border:0;background:#fff;color:var(--pri2);padding:9px 14px;border-radius:10px;font-weight:700}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:-50px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.plain{margin-top:0}.login{max-width:420px;margin:40px auto}
.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:12px}
.tabs button{padding:10px 4px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:10px;font-size:15px;font-weight:500}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
label,.lb{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:8px 14px;border-radius:20px;border:2px solid var(--line);background:none;color:var(--ink);font-size:15px}
.chips button.on{border-color:var(--pri);background:rgba(10,92,255,.12);font-weight:700}
.go{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:18px;font-weight:700}
.go:disabled{opacity:.6}
.sb{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--ink);font-size:14px;margin:2px}
.sb.g{background:var(--ok);color:#fff;border-color:var(--ok)}.sb.r{color:var(--bad);border-color:var(--bad)}
.hint{font-size:13px;color:var(--mute);margin:6px 0 0}
h2{margin:30px 0 10px;font-size:22px}
.pk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.sm{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.sm:last-child{border:0}.sm small{color:var(--mute)}.sm>b,.sm>span:last-child{text-align:right}
footer{margin-top:40px;padding:24px 0;border-top:1px solid var(--line);color:var(--mute);font-size:14px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:14px 18px;border-radius:12px;max-width:92%;display:none;z-index:99}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);width:min(92%,400px);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.bt{display:flex;gap:8px;margin-top:14px}.bt button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--ink);font-size:16px}
.bt .ok{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
.ps{color:var(--acc)}.pa{color:var(--ok)}.pr{color:var(--bad)}
#tb{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin:0;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.08)}
#tb button{border:0;border-radius:12px;background:none;display:flex;flex-direction:column;align-items:center;padding:4px 1px;font-size:11px;color:var(--mute);font-weight:500}
#tb button span{font-size:20px;line-height:1.3;filter:grayscale(1);opacity:.7}
#tb button.on{background:none;color:var(--pri);font-weight:700}#tb button.on span{filter:none;opacity:1}
#app main{padding-bottom:96px}
[hidden]{display:none!important}
</style></head><body>
<header><div class="w"><div class="logo">নেটলিংক<b>.</b> অ্যাডমিন</div><div class="hr"><button class="lk" id="out" hidden>লগআউট</button></div></div></header>
<section id="lg" class="w login"><div class="box plain"><h2 style="margin:0 0 4px">অ্যাডমিন লগইন</h2>
<form onsubmit="return false"><label for="em">ইমেইল</label><input id="em" type="email" autocomplete="email"><label for="pw">পাসওয়ার্ড</label><input id="pw" type="password" autocomplete="current-password">
<p class="hint pr" id="msg"></p><button class="go" id="ag">লগইন</button></form><p class="hint pr" id="st">⚠ স্ক্রিপ্ট চালু হয়নি। ইন্টারনেট/ব্রাউজার চেক করুন বা পেজ রিফ্রেশ করুন।</p></div></section>
<div id="ad" hidden><main class="w">
<h2>অ্যাডমিন প্যানেল</h2>
<div class="pk"><div class="sm"><span>মোট গ্রাহক</span><b id="k1"></b></div><div class="sm"><span>মোট ব্যালেন্স</span><b id="k2"></b></div><div class="sm"><span>পেন্ডিং রিকোয়েস্ট / অর্ডার</span><b id="k3"></b></div></div>
<h2>ব্যালেন্স রিকোয়েস্ট</h2><div class="pk" id="at1"></div>
<h2>পেন্ডিং অর্ডার</h2><div class="pk" id="at4"></div>
<h2>গ্রাহক ও ব্যালেন্স সমন্বয়</h2>
<div class="pk"><div class="row"><div><label for="ju">গ্রাহক</label><select id="ju"></select></div><div><label for="ja">পরিমাণ (বিয়োগ হলে − দিন)</label><input id="ja" inputmode="numeric"></div></div><button class="go" id="jb" style="margin-top:10px;padding:10px;font-size:16px">সমন্বয় করুন</button></div>
<div class="pk" id="at2" style="margin-top:10px"></div>
<h2>সাম্প্রতিক লেনদেন</h2><div class="pk" id="at3"></div>
<h2>মার্চেন্ট নম্বর</h2><div class="pk"><div class="row"><div><label for="cb">বিকাশ</label><input id="cb" maxlength="11"></div><div><label for="cn">নগদ</label><input id="cn" maxlength="11"></div></div><label for="cr">রকেট</label><input id="cr" maxlength="12"><button class="go" id="cs" style="padding:10px;font-size:16px">সেভ করুন</button></div>
</main></div>

<div id="toast"></div>
<script>
document.getElementById('st').textContent='';window.onerror=function(m){document.getElementById('st').textContent='ত্রুটি: '+m};
// ====== এখানে আপনার Supabase তথ্য বসান (Project Settings > API) ======
const SUPABASE_URL='https://hdyzypxswjopyagouwpw.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_WMry2OnjCdMuah2eQPboxA_idjWksIC';
// ==================================================================
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const D='০১২৩৪৫৬৭৮৯',bn=n=>String(n).replace(/\d/g,d=>D[d]),en=s=>String(s).replace(/[০-৯]/g,d=>D.indexOf(d));
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ok=n=>/^01[3-9]\d{8}$/.test(en(n)),M=n=>'৳'+bn(+n);
const dt=t=>new Date(t).toLocaleString('bn-BD');
const OPS=['গ্রামীণফোন','রবি','বাংলালিংক','এয়ারটেল','টেলিটক'],PFX={7:0,3:0,8:1,9:2,4:2,6:3,5:4};
const BILL={'বিদ্যুৎ':['ডেসকো','ডিপিডিসি','নেসকো','পল্লী বিদ্যুৎ'],'গ্যাস':['তিতাস গ্যাস','বাখরাবাদ গ্যাস','জালালাবাদ গ্যাস'],'পানি':['ঢাকা ওয়াসা','চট্টগ্রাম ওয়াসা','খুলনা ওয়াসা'],'ইন্টারনেট':['লিংক৩','আমরা নেটওয়ার্কস','ক্যারিয়ার ব্রডব্যান্ড'],'ল্যান্ডফোন':['বিটিসিএল']};
const MN=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const PAYS={'বিকাশ':'bkash','নগদ':'nagad','রকেট':'rocket'},PN={bkash:'বিকাশ',nagad:'নগদ',rocket:'রকেট'};
const KIND={recharge:'রিচার্জ',bill:'বিল পে',send:'সেন্ড মানি',topup:'ব্যালেন্স যোগ',adjust:'অ্যাডমিন সমন্বয়'};
const ST={pending:['প্রক্রিয়াধীন','ps'],completed:['সম্পন্ন','pa'],refunded:['রিফান্ড','pr'],approved:['যোগ হয়েছে','pa'],rejected:['বাতিল','pr']};
let me=null,tab='r',op='',sm='বিকাশ',am='বিকাশ',mode='in',cfg={},pend=null,timer=null,busy=false;
const toast=t=>{const x=$('#toast');x.textContent=t;x.style.display='block';clearTimeout(x._t);x._t=setTimeout(()=>x.style.display='none',4000)};
const chips=(id,list,cur,fn)=>{$(id).innerHTML=list.map(v=>`<button type="button" class="${v===cur?'on':''}">${v}</button>`).join('');$(id).onclick=e=>{if(e.target.tagName==='BUTTON'){$$(id+' button').forEach(b=>b.classList.toggle('on',b===e.target));fn(e.target.textContent)}}};
const errMsg=e=>{const m=e?.message||'';if(/insufficient/.test(m))return 'ব্যালেন্স কম। আগে ব্যালেন্স যোগ করুন।';if(/duplicate|unique/.test(m))return 'এই তথ্য আগেই ব্যবহৃত হয়েছে (TrxID/মোবাইল)।';if(/forbidden/.test(m))return 'আপনার অনুমতি নেই।';if(/Invalid login/i.test(m))return 'ইমেইল বা পাসওয়ার্ড ভুল (অথবা এই ইমেইলে অ্যাকাউন্ট নেই)।';if(/not confirmed/i.test(m))return 'ইমেইল কনফার্ম হয়নি। মেইলের লিংকে ক্লিক করুন।';if(/rate limit/i.test(m))return 'অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পর আবার করুন।';return 'ব্যর্থ: '+(m||'আবার চেষ্টা করুন।')};

// ---- অ্যাডমিন
async function loadAdmin(){const st0=await sb.from('settings').select('*');(st0.data||[]).forEach(r=>{const m={bkash:'#cb',nagad:'#cn',rocket:'#cr'}[r.key];if(m&&document.activeElement!==$(m))$(m).value=r.value});const[u,tp,tx]=await Promise.all([sb.from('profiles').select('*').order('created_at',{ascending:false}),
sb.from('topups').select('*,profiles(name,phone)').eq('status','pending').order('created_at'),
sb.from('transactions').select('*,profiles(name,phone)').order('created_at',{ascending:false}).limit(60)]);
const us=u.data||[],tps=tp.data||[],txs=tx.data||[],po=txs.filter(t=>t.status==='pending'&&['recharge','bill','send'].includes(t.kind));
const who=r=>E(r.profiles?.name)+' '+bn(E(r.profiles?.phone));
$('#k1').textContent=bn(us.length);$('#k2').textContent=M(us.reduce((s,a)=>s+ +a.balance,0));$('#k3').textContent=bn(tps.length)+' / '+bn(po.length);
$('#at1').innerHTML=tps.length?tps.map(t=>`<div class="sm"><span>${who(t)}<br>${PN[t.method]} · ${M(t.amount)}<br><small>থেকে ${bn(E(t.sender))} · ${E(t.trx)} · ${dt(t.created_at)}</small></span><span><button class="sb g" data-a="ap" data-i="${t.id}">অনুমোদন</button><button class="sb r" data-a="rj" data-i="${t.id}">বাতিল</button></span></div>`).join(''):'<p class="hint">কোনো পেন্ডিং রিকোয়েস্ট নেই।</p>';
$('#at4').innerHTML=po.length?po.map(t=>`<div class="sm"><span>${who(t)}<br>${KIND[t.kind]} · ${M(t.amount)}<br><small>${E(t.details)}</small></span><span><button class="sb g" data-a="dn" data-i="${t.id}">সম্পন্ন</button><button class="sb r" data-a="rf" data-i="${t.id}">রিফান্ড</button></span></div>`).join(''):'<p class="hint">কোনো পেন্ডিং অর্ডার নেই।</p>';
const sel=$('#ju').value;$('#ju').innerHTML=us.map(x=>`<option value="${x.id}">${E(x.name)} ${bn(E(x.phone))}</option>`).join('');if(sel)$('#ju').value=sel;
$('#at2').innerHTML=us.map(x=>`<div class="sm"><span>${E(x.name)} ${x.is_admin?'⭐':''}<br><small>${bn(E(x.phone))} · ${E(x.email)}</small></span><b>${M(x.balance)}</b></div>`).join('');
$('#at3').innerHTML=txs.slice(0,25).map(t=>`<div class="sm"><span>${who(t)}<br><small>${KIND[t.kind]} · ${E(t.details)} · ${dt(t.created_at)}</small></span><b>${M(t.amount)}<br><small class="${ST[t.status][1]}">${ST[t.status][0]}</small></b></div>`).join('')}
$('#ad').onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const i=+b.dataset.i,a=b.dataset.a;b.disabled=true;
const m={ap:['admin_topup',{p_id:i,p_approve:true}],rj:['admin_topup',{p_id:i,p_approve:false}],dn:['admin_order',{p_id:i,p_status:'completed'}],rf:['admin_order',{p_id:i,p_status:'refunded'}]}[a];
if(a==='rf'&&!confirm('গ্রাহককে টাকা ফেরত দেবেন?')){b.disabled=false;return}
const{error}=await sb.rpc(...m);if(error)toast(errMsg(error));else toast('✅ হয়েছে');loadAdmin()};
$('#jb').onclick=async()=>{const a=parseFloat(en($('#ja').value).replace('−','-'));if(!$('#ju').value||!a)return toast('গ্রাহক ও পরিমাণ দিন।');
const{error}=await sb.rpc('admin_adjust',{p_user:$('#ju').value,p_amount:a});if(error)return toast(errMsg(error));$('#ja').value='';toast('✅ হয়েছে');loadAdmin()};
$('#cs').onclick=async()=>{const{error}=await sb.from('settings').upsert([{key:'bkash',value:$('#cb').value.trim()},{key:'nagad',value:$('#cn').value.trim()},{key:'rocket',value:$('#cr').value.trim()}]);toast(error?errMsg(error):'✅ সেভ হয়েছে')};

$('#pns').onclick=async()=>{const{error}=await sb.rpc('update_name',{p_name:$('#pn').value});toast(error?errMsg(error):'✅ নাম বদলানো হয়েছে');load()};
$('#pps').onclick=async()=>{const v=$('#p1').value;if(v.length<8)return toast('কমপক্ষে ৮ অক্ষর দিন।');const{error}=await sb.auth.updateUser({password:v});if(error)return toast(errMsg(error));$('#p1').value='';toast('✅ পাসওয়ার্ড বদলানো হয়েছে')};
$('#pout').onclick=()=>sb.auth.signOut();

const show=id=>{['lg','ad'].forEach(i=>$('#'+i).hidden=i!==id);$('#out').hidden=id!=='ad'};
$('#ag').onclick=async()=>{$('#msg').textContent='অপেক্ষা করুন...';try{const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});$('#msg').textContent=error?errMsg(error):''}catch(e){$('#msg').textContent='সংযোগ ব্যর্থ: '+(e.message||e)}};
$('#out').onclick=()=>sb.auth.signOut();
async function boot(s){clearInterval(timer);if(!s){show('lg');return}
const{data:p,error}=await sb.from('profiles').select('is_admin,name').maybeSingle();
if(error||!p){$('#msg').textContent='প্রোফাইল পাওয়া যায়নি। supabase.sql এর শেষের ব্যাকফিল অংশ রান করুন।';show('lg');return}
if(!p.is_admin){$('#msg').textContent='এই অ্যাকাউন্ট অ্যাডমিন নয়। SQL দিয়ে is_admin = true করুন।';show('lg');return}
show('ad');await loadAdmin();timer=setInterval(loadAdmin,20000)}
sb.auth.onAuthStateChange((ev,s)=>{setTimeout(()=>boot(s),0)});
sb.auth.getSession().then(({data})=>boot(data.session));
</script></body></html>
