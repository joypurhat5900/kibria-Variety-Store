<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ইনস্টল পরীক্ষা – কিবরিয়া টেলিকম</title>
<style>
body{font-family:system-ui,'Noto Sans Bengali','Hind Siliguri',sans-serif;margin:0;background:#f5f3ff;color:#1a1238;line-height:1.6}
main{max-width:560px;margin:auto;padding:16px}
h1{font-size:20px;margin:6px 0 14px}.c{background:#fff;border:1px solid #e6e1fb;border-radius:16px;padding:14px;margin:12px 0}
.ok{color:#12a150;font-weight:700}.bad{color:#e5384f;font-weight:700}small{color:#6b6590;word-break:break-all}
img{width:84px;height:84px;border-radius:16px;border:1px solid #e6e1fb;background:#eee;margin-right:10px}
button{width:100%;padding:14px;border:0;border-radius:14px;background:#6a3df0;color:#fff;font-size:16px;font-weight:700;margin-top:8px}
.r{display:flex;align-items:center;flex-wrap:wrap}
</style></head><body><main>
<h1>ইনস্টল পরীক্ষা</h1>
<p style="margin:0;color:#6b6590">এই পেজ দেখায় আপনার সাইটে এখন কোন নাম ও আইকন আপলোড আছে, আর ফোনে কী জমা আছে।</p>
<div class="c" id="a">লোড হচ্ছে...</div>
<div class="c" id="b"></div>
<div class="c" id="d"></div>
<button id="clr">পুরনো ক্যাশ ও সার্ভিস ওয়ার্কার মুছুন</button>
<p id="msg" class="ok"></p>
<script>
const $=s=>document.querySelector(s),ts='?t='+Date.now(),H=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
(async()=>{
 // ১) live index.html কি নতুন?
 try{const r=await fetch('index.html'+ts,{cache:'no-store'}),t=await r.text();
  $('#a').innerHTML='<b>১) index.html</b><br>'+(/manifest\.webmanifest\?v4/.test(t)?'<span class="ok">✔ নতুন ফাইল আপলোড আছে (নতুন ম্যানিফেস্টের লিংক আছে (v4))</span>':'<span class="bad">✘ পুরনো index.html আছে। নতুন index.html আপলোড করুন।</span>')}catch(e){$('#a').innerHTML='<b>১) index.html</b><br><span class="bad">✘ পড়া যায়নি</span>'}
 // ২) ম্যানিফেস্ট
 try{const r=await fetch('manifest.webmanifest'+ts,{cache:'no-store'});if(!r.ok)throw new Error(r.status);const m=await r.json();
  let h='<b>২) ম্যানিফেস্ট (manifest.webmanifest)</b><br><span class="ok">✔ আছে</span><br>নাম: <b>'+H(m.name)+'</b> · ছোট নাম: <b>'+H(m.short_name)+'</b><div class="r" style="margin-top:8px">';
  const seen={};for(const i of m.icons||[]){const u=i.src.split('?')[0];if(seen[u])continue;seen[u]=1;h+='<div><img src="'+H(u+ts.replace('?','?x='))+'" alt=""><br><small>'+H(u)+'</small></div>'}
  $('#b').innerHTML=h+'</div>'}catch(e){$('#b').innerHTML='<b>২) ম্যানিফেস্ট</b><br><span class="bad">✘ manifest.webmanifest পাওয়া যায়নি ('+H(e.message)+')। ফাইলটা index.html এর ফোল্ডারে আপলোড করুন।</span>'}
 // ৩) ফোনে জমা
 try{const rs=await navigator.serviceWorker.getRegistrations(),ks=await caches.keys();
  $('#d').innerHTML='<b>৩) এই ফোনে জমা থাকা</b><br>সার্ভিস ওয়ার্কার: <b>'+rs.length+'</b>টি<br>ক্যাশ: <b>'+H(ks.join(', ')||'নেই')+'</b>'}catch(e){$('#d').innerHTML='<b>৩)</b> পরীক্ষা করা গেল না'}
})();
$('#clr').onclick=async()=>{try{for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();for(const k of await caches.keys())await caches.delete(k);$('#msg').textContent='✔ মুছে ফেলা হয়েছে। এখন অ্যাপটা মুছে (আনইনস্টল করে) ব্রাউজার বন্ধ করে খুলুন, তারপর সাইট থেকে আবার ইনস্টল করুন।'}catch(e){$('#msg').className='bad';$('#msg').textContent='মুছতে পারেনি: '+e.message}};
</script></main></body></html>
